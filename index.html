<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Pay PH - PayMongo Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 { margin-top: 0; color: #1e293b; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .breakdown {
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin: 15px 0;
      font-size: 14px;
    }
    .breakdown div { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .breakdown .total { font-weight: bold; border-top: 1px solid #cbd5e1; padding-top: 6px; color: #0284c7; }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; }
    #result { margin-top: 15px; text-align: center; }
    a.checkout-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Host Pay PH Test</h2>
  <p style="font-size: 13px; color: #64748b;">Test generating live PayMongo checkout links with automatic fee calculation.</p>
  
  <div class="form-group">
    <label>Target Host Net Payout (₱)</label>
    <input type="number" id="netAmount" value="3000" oninput="calculateFees()" />
  </div>

  <div class="form-group">
    <label>Booking Description</label>
    <input type="text" id="description" value="2 Nights Stay - Deluxe Villa" />
  </div>

  <div class="breakdown">
    <div><span>Host Target Payout:</span> <span>₱<span id="displayNet">3,000.00</span></span></div>
    <div><span>Card & Convenience Fee:</span> <span>₱<span id="displayFee">138.00</span></span></div>
    <div class="total"><span>Total Charged to Guest:</span> <span>₱<span id="displayGross">3,138.00</span></span></div>
  </div>

  <button id="submitBtn" onclick="createPaymentLink()">Generate Checkout Link</button>

  <div id="result"></div>
</div>

<script>
  function calculateFees() {
    const base = parseFloat(document.getElementById('netAmount').value) || 0;
    const fixedFee = 15;
    const rate = 0.035 * 1.12; // ~3.92% gross rate including VAT
    const gross = Math.ceil((base + fixedFee) / (1 - rate));
    const fee = gross - base;

    document.getElementById('displayNet').innerText = base.toLocaleString('en-US', { minimumFractionDigits: 2 });
    document.getElementById('displayFee').innerText = fee > 0 ? fee.toLocaleString('en-US', { minimumFractionDigits: 2 }) : "0.00";
    document.getElementById('displayGross').innerText = gross > 0 ? gross.toLocaleString('en-US', { minimumFractionDigits: 2 }) : "0.00";
  }

  async function createPaymentLink() {
    const btn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');
    const netPayout = document.getElementById('netAmount').value;
    const description = document.getElementById('description').value;

    btn.disabled = true;
    btn.innerText = "Creating Link...";
    resultDiv.innerHTML = "";

    try {
      const response = await fetch('/.netlify/functions/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ netPayout, description })
      });

      const data = await response.json();

      if (data.success) {
        resultDiv.innerHTML = `
          <p style="color: #16a34a; font-weight: bold; margin-bottom: 5px;">Link Generated!</p>
          <a href="${data.paymentUrl}" target="_blank" class="checkout-btn">Open PayMongo Checkout 🚀</a>
        `;
      } else {
        resultDiv.innerHTML = `<p style="color: #dc2626;">Error: ${JSON.stringify(data.error)}</p>`;
      }
    } catch (err) {
      resultDiv.innerHTML = `<p style="color: #dc2626;">Server Request Failed: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
      btn.innerText = "Generate Checkout Link";
    }
  }

  calculateFees();
</script>

</body>
</html>
